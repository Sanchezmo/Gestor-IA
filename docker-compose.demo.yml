version: '3.8'

services:
  # Dolibarr ERP for demo instance
  dolibarr-demo:
    image: tuxgasy/dolibarr:latest
    container_name: dolibarr-demo
    environment:
      - DOLI_DB_HOST=mariadb-demo
      - DOLI_DB_NAME=dolibarr_demo
      - DOLI_DB_USER=dolibarr_demo
      - DOLI_DB_PASSWORD=***REMOVED***
      - DOLI_ADMIN_LOGIN=admin
      - DOLI_ADMIN_PASSWORD=admin123
      - DOLI_URL_ROOT=http://localhost:8081
      - PHP_MEMORY_LIMIT=512M
      - PHP_MAX_EXECUTION_TIME=300
      - PHP_UPLOAD_MAX_FILESIZE=64M
      - PHP_POST_MAX_SIZE=64M
      - TZ=Europe/Madrid
    ports:
      - "8081:80"
    volumes:
      - dolibarr-demo-docs:/var/www/documents
      - dolibarr-demo-custom:/var/www/html/custom
    depends_on:
      mariadb-demo:
        condition: service_healthy
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MariaDB for Dolibarr
  mariadb-demo:
    image: mariadb:10.11
    container_name: mariadb-demo
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=***REMOVED***
      - MARIADB_DATABASE=dolibarr_demo
      - MARIADB_USER=dolibarr_demo
      - MARIADB_PASSWORD=***REMOVED***
    volumes:
      - mariadb-demo-data:/var/lib/mysql
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p***REMOVED***"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis for Hermes
  redis-demo:
    image: redis:7-alpine
    container_name: redis-demo
    command: redis-server --requirepass ***REMOVED***
    ports:
      - "6379:6379"
    volumes:
      - redis-demo-data:/data
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "***REMOVED***", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama for local AI (optional - for LOCAL_ONLY)
  ollama-demo:
    image: ollama/ollama:latest
    container_name: ollama-demo
    ports:
      - "11434:11434"
    volumes:
      - ollama-demo-data:/root/.ollama
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  dolibarr-demo-docs:
  dolibarr-demo-custom:
  mariadb-demo-data:
  redis-demo-data:
  ollama-demo-data:

networks:
  demo-network:
    driver: bridge