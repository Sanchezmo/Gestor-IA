# Dolibarr Development - Apache VirtualHost
# Puerto 8081 para compatibilidad con config actual

<VirtualHost *:8081>
    ServerName dolibarr.development.local
    DocumentRoot /var/www/dolibarr/development/htdocs
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/dolibarr-development_error.log
    CustomLog ${APACHE_LOG_DIR}/dolibarr-development_access.log combined
    
    # PHP config
    php_value memory_limit 512M
    php_value max_execution_time 300
    php_value upload_max_filesize 64M
    php_value post_max_size 64M
    php_value date.timezone Europe/Madrid
    php_value error_log /var/log/apache2/dolibarr-development_php_error.log
    php_value log_errors On
    php_value error_reporting E_ALL
    php_value display_errors Off
    php_value display_startup_errors Off
    
    <Directory /var/www/dolibarr/development/htdocs>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Rewrite for Dolibarr API
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^api/(.*)$ api/index.php [QSA,L]
        </IfModule>
    </Directory>
    
    # Custom directory
    <Directory /var/www/dolibarr/development/custom>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Documents - deny direct access
    <Directory /var/lib/dolibarr/documents/development>
        Require all denied
    </Directory>
</VirtualHost>
