version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-type: "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
          - "pre-commit*"
        update-types:
          - "minor"
          - "patch"
      ai-dependencies:
        patterns:
          - "ollama*"
          - "openai*"
          - "anthropic*"
        update-types:
          - "minor"
          - "patch"
      web-dependencies:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "httpx*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"
      db-dependencies:
        patterns:
          - "sqlalchemy*"
          - "asyncpg*"
          - "pymysql*"
          - "redis*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"