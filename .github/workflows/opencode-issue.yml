name: OpenCode - Issue to PR

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  opencode-issue:
    name: OpenCode Issue Handler
    if: >
      github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'opencode' ||
      github.event_name == 'issue_comment' && contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install.sh | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract Issue Info
        id: issue
        run: |
          if [ "${{ github.event_name }}" == "issues" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            ISSUE_TITLE="${{ github.event.issue.title }}"
            ISSUE_BODY="${{ github.event.issue.body }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            ISSUE_TITLE="${{ github.event.issue.title }}"
            ISSUE_BODY="${{ github.event.issue.body }}"
          fi
          echo "number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "body=$ISSUE_BODY" >> $GITHUB_OUTPUT

      - name: Create Branch
        id: branch
        run: |
          ISSUE_NUM="${{ steps.issue.outputs.number }}"
          ISSUE_TITLE="${{ steps.issue.outputs.title }}"
          SHORT_DESC=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-50)
          BRANCH_NAME="oc/issue-${ISSUE_NUM}-${SHORT_DESC}"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git fetch origin main
          git checkout -b "$BRANCH_NAME" origin/main

      - name: Prepare OpenCode Prompt
        id: prompt
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          python3 .github/scripts/gen_opencode_prompt.py

      - name: Run OpenCode
        id: opencode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opencode run --file /tmp/opencode_prompt.md 2>&1 | tee /tmp/opencode_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          make test-unit
          make test-isolation
          make pre-commit

      - name: Commit Changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "feat: implement issue #${{ steps.issue.outputs.number }} - ${{ steps.issue.outputs.title }}" -m "Implemented via OpenCode automation." -m "Closes #${{ steps.issue.outputs.number }}"

      - name: Push Branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[OpenCode] Issue #${{ steps.issue.outputs.number }}: ${{ steps.issue.outputs.title }}`,
              head: '${{ steps.branch.outputs.branch }}',
              base: 'main',
              body: '## Summary\nThis PR was automatically created by OpenCode to address **Issue #${{ steps.issue.outputs.number }}**.\n\n### Issue\n**Title:** ${{ steps.issue.outputs.title }}\n**Number:** #${{ steps.issue.outputs.number }}\n\n### Changes Made\n- See commit history for detailed changes\n- Implementation follows project architecture (README.md, AGENTS.md)\n- All changes are within the scope of the original issue\n\n### Tests Executed\n- \u2705 Unit tests (`make test-unit`)\n- \u2705 Isolation tests (`make test-isolation`) - CRITICAL for multi-instance architecture\n- \u2705 Quality checks (`make pre-commit`: lint, format, type-check)\n\n### Risk Assessment\n- Changes limited to issue scope\n- No business logic modifications (invoices, Telegram, Dolibarr, multi-company isolation) unless explicitly required\n- All secrets handled per project policy (never logged, never committed)\n\n### Review Checklist\n- [ ] Implementation matches issue requirements\n- [ ] All tests pass\n- [ ] Code follows project conventions\n- [ ] No secrets exposed\n- [ ] Multi-instance isolation preserved\n- [ ] Human approval required before merge'
            });
            console.log('PR created: ' + pr.html_url);
            core.setOutput('pr_url', pr.html_url);

      - name: Comment on Issue
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              body: '\uD83E\uDD16 OpenCode has created a Pull Request for this issue: ' + '${{ steps.create-pr.outputs.pr_url }}' + '\n\n**Branch:** `' + '${{ steps.branch.outputs.branch }}' + '`\n**Tests:** Unit, Isolation, and Quality checks passed\n\nPlease review the PR and provide feedback. OpenCode can address review comments on the same branch.'
            });

      - name: Report Failure
        if: steps.changes.outputs.has_changes == 'false' || steps.opencode.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              body: '\u26A0\uFE0F OpenCode automation did not produce changes or encountered an issue.\n\n**Exit code:** ' + '${{ steps.opencode.outputs.exit_code }}' + '\n**Changes detected:** ' + '${{ steps.changes.outputs.has_changes }}' + '\n\nPlease check the workflow logs for details. You may need to:\n1. Clarify the issue requirements\n2. Run OpenCode manually with more context\n3. Implement manually and create a PR'
            });