name: OpenCode - PR Review Handler

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  opencode-pr-review:
    name: OpenCode PR Review Handler
    if: >
      github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/opencode') ||
      github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && contains(github.event.review.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install.sh | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract PR Info
        id: pr
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_BASE="${{ github.event.pull_request.base.ref }}"
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "branch=$PR_BRANCH" >> $GITHUB_OUTPUT
          echo "base=$PR_BASE" >> $GITHUB_OUTPUT

      - name: Extract Review Feedback
        id: feedback
        run: |
          if [ "${{ github.event_name }}" == "pull_request_review_comment" ]; then
            COMMENT_BODY="${{ github.event.comment.body }}"
            COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
            COMMENT_URL="${{ github.event.comment.html_url }}"
          else
            COMMENT_BODY="${{ github.event.review.body }}"
            COMMENT_AUTHOR="${{ github.event.review.user.login }}"
            COMMENT_URL="${{ github.event.review.html_url }}"
          fi
          echo "body=$COMMENT_BODY" >> $GITHUB_OUTPUT
          echo "author=$COMMENT_AUTHOR" >> $GITHUB_OUTPUT
          echo "url=$COMMENT_URL" >> $GITHUB_OUTPUT

      - name: Fetch All Review Comments
        id: all_comments
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr.outputs.number }}
            });
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr.outputs.number }}
            });
            let allFeedback = [];
            for (const c of comments.data) {
              if (c.body.includes('/opencode')) {
                allFeedback.push(`**Comment by @${c.user.login}** (${c.html_url}):\n${c.body}`);
              }
            }
            for (const r of reviews.data) {
              if (r.body && r.body.includes('/opencode')) {
                allFeedback.push(`**Review by @${r.user.login}** (${r.html_url}):\n${r.body}`);
              }
            }
            return allFeedback.join('\n\n---\n\n');
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare OpenCode Prompt
        id: prompt
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_BASE: ${{ steps.pr.outputs.base }}
          ALL_FEEDBACK: ${{ steps.all_comments.outputs.result }}
        run: |
          python3 .github/scripts/gen_opencode_pr_prompt.py

      - name: Run OpenCode
        id: opencode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opencode run --file /tmp/opencode_pr_prompt.md 2>&1 | tee /tmp/opencode_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          make test-unit
          make test-isolation
          make pre-commit

      - name: Commit Changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "fix: address review feedback on PR #${{ steps.pr.outputs.number }}" -m "Addressed review comments from @${{ steps.feedback.outputs.author }}." -m "Implemented via OpenCode automation."

      - name: Push Changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.pr.outputs.branch }}"

      - name: Comment on PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: '\uD83E\uDD16 OpenCode has addressed review feedback on this PR.\n\n**Branch:** `' + '${{ steps.pr.outputs.branch }}' + '` (updated)\n**Tests:** Unit, Isolation, and Quality checks passed\n\n### Addressed Comments\nOpenCode processed all review comments containing `/opencode` and implemented fixes.\n\nPlease review the new commits and verify the changes resolve your feedback.'
            });

      - name: Report No Changes
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: '\u26A0\uFE0F OpenCode analyzed the review feedback but made no changes.\n\n**Exit code:** ' + '${{ steps.opencode.outputs.exit_code }}' + '\n\nThis may mean:\n1. The feedback was already addressed\n2. The feedback requires human judgment/architecture decisions\n3. The feedback is out of scope for automated fixes\n\nPlease review the workflow logs and consider manual implementation if needed.'
            });

      - name: Report Failure
        if: steps.opencode.outputs.exit_code != '0' && steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: '\u274C OpenCode encountered an error while processing review feedback.\n\n**Exit code:** ' + '${{ steps.opencode.outputs.exit_code }}' + '\n\nPlease check the workflow logs for details. Manual intervention may be required.'
            });