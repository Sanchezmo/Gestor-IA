[project]
name = "gestor-ia"
version = "0.1.0"
description = "Plataforma empresarial multiempresa y multisector asistida por IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",  # Solo si se usa PostgreSQL para auditoría
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.0",
]
optional-dependencies = {
    "dev": [
        "pytest>=8.2.0",
        "pytest-asyncio>=0.23.0",
        "pytest-cov>=5.0.0",
        "httpx>=0.27.0",
        "ruff>=0.4.0",
        "mypy>=1.10.0",
        "pre-commit>=3.7.0",
    ],
    "celery": [
        "celery>=5.4.0",
        "redis>=5.0.0",
    ],
    "postgresql": [
        "asyncpg>=0.29.0",
    ],
    "ai": [
        "ollama>=0.3.0",
    ],
}

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PTH", # pathlib
    "TID", # tidy-imports
]
ignore = [
    "B008",  # Depends in argument defaults - FastAPI pattern
    "DTZ003", # datetime.utcnow() - acceptable for UTC timestamps
    "DTZ005", # datetime.now() without tz - acceptable for UTC timestamps
    "DTZ006", # fromtimestamp without tz
    "DTZ007", # strptime without %z
    "DTZ011", # date.today()
    "B904",   # raise from err
    "E402",   # Module level import not at top of file
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "companies",
    "scripts",
    "tests",
]
import-headings = {
    "STDLIB": "std",
    "THIRDPARTY": "third",
    "FIRSTPARTY": "first",
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["core", "companies"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]